name: Shared application release publication
on:
  workflow_call:
    inputs:
      reference:
        type: string
        required: true
      source-commit:
        type: string
        required: true
      producer-run-id:
        type: number
        required: true
      producer-run-attempt:
        type: number
        required: true
      artifact-id:
        type: number
        default: 0
permissions:
  contents: write
  actions: read
  pull-requests: read
  id-token: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Authenticate immutable shared workflow revision
        id: bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $response = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=clc-deployment') -Headers @{Authorization=('Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)} -TimeoutSec 30
            $part = $response.value.Split('.')[1].Replace('-','+').Replace('_','/')
            $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($part.PadRight($part.Length + (4 - $part.Length % 4) % 4,'='))) | ConvertFrom-Json -AsHashtable
            $expected = 'clcdpc/clc-deployment/.github/workflows/application-release.yml@' + $claims.job_workflow_sha
            if ($claims.iss -cne 'https://token.actions.githubusercontent.com' -or $claims.aud -cne 'clc-deployment' -or $claims.job_workflow_sha -cnotmatch '^[a-f0-9]{40}$' -or $claims.job_workflow_ref -cne $expected -or $claims.exp -le [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) { throw 'Invalid platform identity.' }
            $projection = [ordered]@{}
            foreach ($key in @('iss','aud','repository','workflow_ref','workflow_sha','job_workflow_ref','job_workflow_sha','event_name','actor','environment')) { if ($claims.Contains($key)) { $projection[$key] = $claims[$key] } }
            'sha=' + $claims.job_workflow_sha | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'claims=' + ($projection | ConvertTo-Json -Compress) | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } catch { throw 'Cannot authenticate immutable shared workflow through the GitHub job endpoint.' }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: clcdpc/clc-deployment
          ref: ${{ steps.bootstrap.outputs.sha }}
          persist-credentials: false
      - name: Verify producer and publish exact release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLC_CLAIMS: ${{ steps.bootstrap.outputs.claims }}
          CLC_REPOSITORY: ${{ github.repository }}
          CLC_REFERENCE: ${{ inputs.reference }}
          CLC_SOURCE: ${{ inputs.source-commit }}
          CLC_RUN: ${{ inputs.producer-run-id }}
          CLC_ATTEMPT: ${{ inputs.producer-run-attempt }}
          CLC_ARTIFACT: ${{ inputs.artifact-id }}
        run: |
          & tools/release/Invoke-ClcApplicationWorkflow.ps1 -Action Release -ClaimsJson $env:CLC_CLAIMS -Repository $env:CLC_REPOSITORY -Reference $env:CLC_REFERENCE -SourceCommit $env:CLC_SOURCE -RunId ([long]$env:CLC_RUN) -RunAttempt ([long]$env:CLC_ATTEMPT) -ArtifactId ([long]$env:CLC_ARTIFACT) -OutputDirectory (Join-Path $env:RUNNER_TEMP 'clc-application-release')
