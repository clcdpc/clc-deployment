name: Signed receipt qualification
on:
  push:
    # Synthetic data; excluded from build-test-publish. Never deploy or publish.
    tags: ['v9999.9999.9999-dev.*']
permissions:
  contents: read
jobs:
  producer:
    uses: clcdpc/clc-deployment/.github/workflows/clc-receipt-producer.yml@b85cc05b5646352c87cf0b86246fa7c80c11a1ba
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
  verify:
    needs: producer
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: clc-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/package
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: clc-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/receipt
      - name: Acquire the exact independently pinned verifier and root
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin=Get-Content tools/automation-verifier.lock.json -Raw | ConvertFrom-Json
          $root=Join-Path $env:RUNNER_TEMP 'evidence'
          $zip=Join-Path $root 'gh.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $zip -TimeoutSec 120
          if ((Get-FileHash $zip).Hash.ToLowerInvariant() -cne $pin.archiveSha256) { throw 'CLI archive pin mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'verifier')
          $trust=Get-Content tools/receipt-qualification.lock.json -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath $trust.trustedRootPath -Destination (Join-Path $root 'trusted-root.jsonl')
      - name: Verify real custom receipt offline and reject incorrect identities/bytes
        shell: pwsh
        run: ./tools/Test-SignedReceipt.ps1 -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'evidence') -ProducerCommit b85cc05b5646352c87cf0b86246fa7c80c11a1ba
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: receipt-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence/package/
            ${{ runner.temp }}/evidence/receipt/
            ${{ runner.temp }}/evidence/trusted-root.jsonl
            ${{ runner.temp }}/evidence/verified.json
            ${{ runner.temp }}/evidence/qualification.json
          if-no-files-found: error
          retention-days: 90
