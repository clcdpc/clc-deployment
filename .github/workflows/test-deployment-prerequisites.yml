name: deployment-prerequisites-tests
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  workflow-smoke:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/validate-deployment.yml
    with:
      application_id: validator-smoke
      target_id: validator-smoke-not-configured
      environment_name: validator-smoke-not-configured
      runner_group: validator-smoke-not-configured
      release_workflow: .github/workflows/build-test-publish.yaml
      deployment_workflow: .github/workflows/validate-deployment.yml

  workflow-smoke-empty:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/validate-deployment.yml
    with:
      application_id: validator-smoke
      target_id: validator-smoke-not-configured
      environment_name: validator-smoke-not-configured
      runner_group: ''
      runner_labels: ''
      release_workflow: .github/workflows/build-test-publish.yaml
      deployment_workflow: .github/workflows/validate-deployment.yml

  smoke-outputs:
    needs: [workflow-smoke, workflow-smoke-empty]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Verify diagnostic outputs without enabling deployment
        shell: pwsh
        env:
          CLC_CONFIGURED: ${{ toJSON(needs.workflow-smoke.outputs) }}
          CLC_EMPTY: ${{ toJSON(needs.workflow-smoke-empty.outputs) }}
        run: |
          foreach ($scenario in @(@{json=$env:CLC_CONFIGURED;empty=$false},@{json=$env:CLC_EMPTY;empty=$true})) {
            $outputs=$scenario.json | ConvertFrom-Json -AsHashtable
            if ($outputs.ready -cne 'false') { throw 'Unconfigured smoke target must report ready=false.' }
            if ($outputs.host_status -cne 'UNVERIFIED' -or $outputs.github_status -cnotin @('FAIL','UNVERIFIED')) { throw 'Invalid category smoke outputs.' }
            $report=$outputs.report_json | ConvertFrom-Json -AsHashtable
            if ($report.contract_version -ne 3 -or $report.ready) { throw 'Missing contract-3 NOT READY report.' }
            foreach ($key in @('passed','failed','unverified','skipped','not_applicable')) {
              if ($outputs[($key+'_count')] -cnotmatch '^[0-9]+$') { throw 'Missing numeric workflow output.' }
              if ([int]$outputs[($key+'_count')] -ne $report.counts[$key]) { throw 'Workflow count differs from report.' }
            }
            foreach ($id in @('repository.identity','branch.protection','tags.creation','workflow.producer','workflow.caller','environment.exists','runner.group','runner.labels')) {
              if (@($report.checks | Where-Object id -CEQ "github.$id").Count -ne 1) { throw 'Independent GitHub finding missing.' }
            }
            if ($scenario.empty) {
              foreach ($id in @('group','labels')) {
                if (($report.checks | Where-Object id -CEQ "github.runner.$id").status -cne 'FAIL') { throw 'Missing runner configuration must FAIL.' }
              }
              foreach ($id in @('repository-access','workflow-access')) {
                if (($report.checks | Where-Object id -CEQ "github.runner.$id").status -cne 'SKIPPED') { throw 'Dependent runner inspection must be SKIPPED.' }
              }
            }
            if (@($report.checks | Where-Object category -eq host).Count) { throw 'Hosted inspection must not fabricate host observations.' }
          }

  validator:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Provision exact verified test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('clc-prerequisites-tests-' + [guid]::NewGuid())
          [void][IO.Directory]::CreateDirectory($root)
          $lock = Get-Content -LiteralPath tools/dependencies.lock.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($name in @('powershell','pester')) {
            $archive = Join-Path $root ($name + '.zip')
            Invoke-WebRequest -Uri $lock[$name].url -OutFile $archive -TimeoutSec 120
            if ((Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -cne $lock[$name].sha256) { throw 'Test dependency hash mismatch.' }
            [IO.Compression.ZipFile]::ExtractToDirectory($archive,(Join-Path $root $name))
          }
          $deps = & tools/deployment-prerequisites/Initialize-Dependencies.ps1 -Destination (Join-Path $root 'diagnostics') -IncludeActionlint
          "CLC_TEST_PWSH=$root/powershell/pwsh.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "CLC_TEST_PESTER=$root/pester/Pester.psd1" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "CLC_TEST_YAML=$($deps.YamlAssemblyPath)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "CLC_TEST_ACTIONLINT=$($deps.ActionlintPath)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run offline API fixtures, YAML syntax and actionlint
        shell: pwsh
        run: |
          & $env:CLC_TEST_PWSH -NoLogo -NoProfile -NonInteractive -File tools/Test-DeploymentPrerequisites.ps1 -PesterManifestPath $env:CLC_TEST_PESTER -YamlAssemblyPath $env:CLC_TEST_YAML -ActionlintPath $env:CLC_TEST_ACTIONLINT
          if ($LASTEXITCODE -ne 0) { throw 'Deployment prerequisites verification failed.' }
