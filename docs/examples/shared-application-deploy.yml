# Publication/deployment tail of the SAME tagged consumer workflow.
# Add these jobs after package; do not install a workflow_run consumer.
name: Application release stages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  package:
    uses: clcdpc/clc-deployment/.github/workflows/application-build.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
  publication:
    needs: package
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: clcdpc/clc-deployment/.github/workflows/application-release.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(github.run_attempt) }}
  deployment:
    needs: publication
    uses: clcdpc/clc-deployment/.github/workflows/application-deploy.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(github.run_attempt) }}
