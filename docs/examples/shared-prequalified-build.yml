# Consumer producer-job example. Check out the exact application source and
# keep the existing frontend/browser/.NET/SQL qualification before packaging.
# Use producer.job=package and omit jobName (or set its exact REST display name).
# Application release identity must match Get-ClcVerifiedSource.identity.releaseId.
# packages.lock.json is optional here: record its actual digest when present,
# otherwise contract-3 metadata/manifest record dependencyLockSha256: null. Existing CI
# owns qualification and its restore convention; the shared conventional builder
# separately retains its required locked restore.
name: Application release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # Check out the application source and set up its pinned toolchain here.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: clcdpc/clc-deployment
          ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          path: machinery
          persist-credentials: false
      - name: Select writable NTFS for qualified web files
        shell: pwsh
        run: |
          . machinery/tools/HostedScratch.ps1
          "CLC_HOSTED_SCRATCH=$(New-ClcHostedScratchDirectory)" >> $env:GITHUB_ENV
      # Run consumer qualification and publish to CLC_HOSTED_SCRATCH/qualified-publish here.
      - name: Package already qualified application files
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLC_REFERENCE: ${{ github.ref_name }}
          CLC_SOURCE: ${{ github.sha }}
        run: |
          $sdkVersion = (& dotnet --version).Trim() # Same pinned SDK used by this producer's own CI.
          if ($LASTEXITCODE -ne 0) { throw 'Producer SDK identity is unavailable.' }
          & machinery/tools/release/New-ClcApplicationPackage.ps1 -ConfigurationPath (Join-Path $PWD '.clc/release.json') -SourceRoot $PWD.Path -Reference $env:CLC_REFERENCE -SourceCommit $env:CLC_SOURCE -SharedSourceCommit 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' -RunId ([long]$env:GITHUB_RUN_ID) -RunAttempt ([long]$env:GITHUB_RUN_ATTEMPT) -QualifiedPublishRoot (Join-Path $env:CLC_HOSTED_SCRATCH 'qualified-publish') -SdkVersion $sdkVersion -ValidationEntryPoint Example.dll -OutputDirectory (Join-Path $env:CLC_HOSTED_SCRATCH 'shared-package')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}/release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  publication:
    needs: package
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: clcdpc/clc-deployment/.github/workflows/application-release.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(github.run_attempt) }}
  deployment:
    needs: publication
    uses: clcdpc/clc-deployment/.github/workflows/application-deploy.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(github.run_attempt) }}
